<meta charset="UTF-8">
<title>Galerie d'Art</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #080a12;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* Écran d'accueil épuré, sobre et classique (sans glassmorphism ni néon) */
  #start-screen {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #13110f; color: #ede5da; z-index: 100; text-align: center; padding: 25px;
  }
  #start-screen h1 {
    font-family: 'Georgia', 'Playfair Display', serif;
    font-size: clamp(38px, 6.5vw, 70px);
    margin: 0 0 36px;
    font-weight: 300;
    letter-spacing: 5px;
    color: #f5eee4;
  }
  #start-screen .enter-btn {
    padding: 14px 42px;
    border: 1px solid #baa994;
    background: transparent;
    color: #f5eee4;
    font-family: 'Georgia', serif;
    font-size: 15px;
    letter-spacing: 2px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  #start-screen .enter-btn:hover {
    background: #f5eee4;
    color: #13110f;
    border-color: #f5eee4;
  }

  /* HUD discret en jeu */
  #hud-top-left {
    position: fixed; top: 16px; left: 16px; color: #f2ebe0; font-size: 13px; line-height: 1.7;
    background: rgba(18, 16, 20, 0.82);
    padding: 14px 20px; border-radius: 12px; border: 1px solid #4a3e32;
    pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,0.55);
  }
  #hud-top-left b {
    display: inline-block; background: #382c20; color: #f2dec4;
    padding: 1px 7px; border-radius: 4px; font-weight: 600; font-size: 11px;
    border: 1px solid #665038;
  }
  #hud-top-left .title {
    font-size: 14px; font-weight: bold; color: #deb881;
    letter-spacing: 0.5px; margin-bottom: 6px; text-transform: uppercase;
  }

  #hud-top-right {
    position: fixed; top: 16px; right: 16px; display: flex; gap: 10px; z-index: 5;
  }
  .hud-btn {
    background: rgba(18, 16, 20, 0.88);
    border: 1px solid #5a4936; color: #f2dec4;
    padding: 9px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 7px; transition: all 0.2s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.45);
  }
  .hud-btn:hover {
    background: #36281a; border-color: #c4995c; color: #fff;
    transform: translateY(-2px);
  }

  /* Indication contextuelle */
  #hint {
    position: fixed; bottom: 35px; left: 50%; transform: translateX(-50%);
    color: #f7eee2; font-size: 15px; font-weight: 500; letter-spacing: 0.4px;
    background: rgba(22, 18, 24, 0.92);
    padding: 12px 28px; border-radius: 25px; display: none; pointer-events: none;
    border: 1px solid #665038; box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    transition: opacity 0.3s;
  }


  /* Bulle de dialogue pour Dudu */
  #dudu-bubble {
    position: fixed;
    transform: translate(-50%, -100%);
    background: #ffffff;
    color: #3b2212;
    padding: 14px 22px;
    border-radius: 16px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.35), 0 0 0 2px #d4a36f;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.45;
    text-align: center;
    pointer-events: none;
    z-index: 50;
    display: none;
    white-space: pre-line;
    animation: bounceBubble 2.2s ease-in-out infinite;
  }
  @keyframes bounceBubble {
    0%, 100% { transform: translate(-50%, -100%) translateY(0); }
    50% { transform: translate(-50%, -100%) translateY(-6px); }
  }
  #dudu-bubble::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 10px solid #ffffff;
  }

  #crosshair {
    position: fixed; top: 50%; left: 50%; width: 5px; height: 5px;
    transform: translate(-50%, -50%); border-radius: 50%;
    background: rgba(255, 255, 255, 0.5); pointer-events: none; display: none;
  }

/* =====================================================================
   MOTEUR AUDIO PROCÉDURAL : MUSIQUE DOUCE & BRUITS DE PAS
   ===================================================================== */
let audioCtx = null;
let masterGain = null;
let musicGain = null;
let soundEnabled = true;

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
      audioCtx = new AudioContext();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.36;
      masterGain.connect(audioCtx.destination);

      musicGain = audioCtx.createGain();
      musicGain.gain.value = 0.16;
      musicGain.connect(masterGain);

      startCozyMusic();
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

const CHORDS = [
  [174.61, 220.00, 261.63, 329.63], // Fmaj7
  [196.00, 246.94, 293.66, 392.00], // G6
  [164.81, 196.00, 246.94, 329.63], // Em7
  [220.00, 261.63, 329.63, 440.00], // Am7
];
let chordIndex = 0;

function playCozyPianoNote(freq, time, dur) {
  if (!audioCtx || !musicGain) return;
  const osc = audioCtx.createOscillator();
  const noteGain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, time);

  noteGain.gain.setValueAtTime(0, time);
  noteGain.gain.linearRampToValueAtTime(0.2, time + 0.05);
  noteGain.gain.exponentialRampToValueAtTime(0.001, time + dur);

  osc.connect(noteGain);
  noteGain.connect(musicGain);
  osc.start(time);
  osc.stop(time + dur);
}

function startCozyMusic() {
  if (!audioCtx) return;
  const scheduleNextChord = () => {
    if (!soundEnabled) {
      setTimeout(scheduleNextChord, 3500);
      return;
    }
    const now = audioCtx.currentTime;
    const chord = CHORDS[chordIndex % CHORDS.length];
    chordIndex++;

    chord.forEach((note, idx) => {
      playCozyPianoNote(note, now + idx * 0.06, 3.2);
    });

    setTimeout(scheduleNextChord, 3600);
  };
  scheduleNextChord();
}

function playFootstep(isInside, isRunning, onCarpet = false) {
  if (!audioCtx || !soundEnabled || audioCtx.state !== 'running') return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  if (onCarpet) {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(95 + Math.random() * 20, now);
    osc.frequency.exponentialRampToValueAtTime(35, now + 0.08);
    gain.gain.setValueAtTime(isRunning ? 0.22 : 0.14, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
  } else if (isInside) {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(450 + Math.random() * 100, now);
    osc.frequency.exponentialRampToValueAtTime(80, now + 0.04);
    gain.gain.setValueAtTime(isRunning ? 0.20 : 0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
  } else {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(220 + Math.random() * 60, now);
    osc.frequency.exponentialRampToValueAtTime(60, now + 0.05);
    gain.gain.setValueAtTime(isRunning ? 0.18 : 0.11, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
  }

  osc.connect(gain);
  gain.connect(masterGain);
  osc.start(now);
  osc.stop(now + 0.09);
}

function playJoyfulChime() {
  if (!audioCtx || !soundEnabled || audioCtx.state !== 'running') return;
  const now = audioCtx.currentTime;
  const notes = [523.25, 659.25, 783.99, 1046.50];
  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now + i * 0.12);
    gain.gain.setValueAtTime(0.20, now + i * 0.12);
    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.9);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(now + i * 0.12);
    osc.stop(now + i * 0.12 + 0.95);
  });
}

function playDoorCreak() {
  if (!audioCtx || !soundEnabled || audioCtx.state !== 'running') return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(140, now);
  osc.frequency.linearRampToValueAtTime(220, now + 0.35);
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 550;
  gain.gain.setValueAtTime(0.01, now);
  gain.gain.linearRampToValueAtTime(0.12, now + 0.15);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  osc.start(now);
  osc.stop(now + 0.75);
}

/* =====================================================================

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const wrapAngle = a => Math.atan2(Math.sin(a), Math.cos(a));

function setSRGB(t) {
  if (!t) return;
  if ('colorSpace' in t && THREE.SRGBColorSpace) t.colorSpace = THREE.SRGBColorSpace;
  else if ('encoding' in t && THREE.sRGBEncoding) t.encoding = THREE.sRGBEncoding;

{

  groundGrad.addColorStop(0.5, '#06080d');
  groundGrad.addColorStop(1, '#030407');

  ng.fillRect(0, 256, 1024, 256);
}
const nightTex = new THREE.CanvasTexture(nightCanvas);
setSRGB(nightTex);
nightTex.mapping = THREE.EquirectangularReflectionMapping;

scene.environment = nightEnvMap;

scene.add(moonLight, moonLight.target);

/* =====================================================================
   MURS DU MUSÉE SUBLIMES : PAPIER PEINT DAMASSÉ & BOISERIES
   ===================================================================== */
function createDamaskWallpaperTex() {
  const s = 512;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');

  g.fillStyle = '#f8f2e6';
  g.fillRect(0, 0, s, s);

  for (let y = 0; y < s; y += 4) {
    g.fillStyle = 'rgba(230, 218, 200, 0.22)';
    g.fillRect(0, y, s, 1.5);
  }

  const step = 128;
  for (let y = 0; y < s + step; y += step) {
    for (let x = 0; x < s + step; x += step) {
      const cx = x + ((y / step) % 2 ? step / 2 : 0);
      const cy = y;

      g.strokeStyle = 'rgba(205, 168, 115, 0.42)';
      g.lineWidth = 3.5;
      g.beginPath();
      g.ellipse(cx, cy, 32, 54, 0, 0, Math.PI * 2);
      g.stroke();

      g.fillStyle = 'rgba(215, 178, 125, 0.32)';
      g.beginPath();
      g.arc(cx, cy, 14, 0, Math.PI * 2);
      g.fill();

      g.beginPath();
      g.ellipse(cx - 22, cy, 12, 24, 0.4, 0, Math.PI * 2);
      g.ellipse(cx + 22, cy, 12, 24, -0.4, 0, Math.PI * 2);
      g.fill();

      g.fillStyle = 'rgba(195, 155, 100, 0.45)';
      g.beginPath();
      g.arc(cx, cy - 42, 5, 0, Math.PI * 2);
      g.arc(cx, cy + 42, 5, 0, Math.PI * 2);
      g.fill();
    }
  }

  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(8, 4);
  setSRGB(t);
  return t;
}

{

      g.strokeStyle = 'rgba(40, 20, 10, 0.12)';
      g.strokeRect(x + shift, y, pw, ph);

  }
}
const parquetTex = new THREE.CanvasTexture(parquetTexC);
parquetTex.wrapS = parquetTex.wrapT = THREE.RepeatWrapping;
parquetTex.repeat.set(12, 16);

function createPersianCarpetTex() {
  const w = 512, h = 1024;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = '#6b1422';
  g.fillRect(0, 0, w, h);

  g.strokeStyle = '#dca84c';
  g.lineWidth = 14;
  g.strokeRect(16, 16, w - 32, h - 32);

  g.strokeStyle = '#f2cb7a';
  g.lineWidth = 3;
  g.strokeRect(32, 32, w - 64, h - 64);

  for (let y = 64; y < h - 64; y += 128) {
    g.fillStyle = 'rgba(220, 168, 76, 0.45)';
    g.beginPath();
    g.arc(w / 2, y + 64, 46, 0, Math.PI * 2);
    g.fill();
    g.strokeStyle = '#f2cb7a';
    g.lineWidth = 3;
    g.stroke();

    g.fillStyle = '#9e2236';
    g.beginPath();
    g.arc(w / 2, y + 64, 24, 0, Math.PI * 2);
    g.fill();

    for (const sx of [w * 0.25, w * 0.75]) {
      g.fillStyle = 'rgba(240, 200, 120, 0.35)';
      g.beginPath();
      g.arc(sx, y + 64, 18, 0, Math.PI * 2);
      g.fill();
    }
  }

  g.fillStyle = '#f8f4eb';
  for (let x = 12; x < w - 12; x += 4) {
    g.fillRect(x, 0, 2, 10);
    g.fillRect(x, h - 10, 2, 10);
  }

  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1, 10);
  setSRGB(t);
  return t;
}

function addBox(w, h, d, x, y, z, mat, { collide = true, block = true, cast = true, receive = true, parent = scene } = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = cast; m.receiveShadow = receive;
  parent.add(m);
  if (collide) colliders.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2 });
  if (block) camBlockers.push(m);
  return m;
}
function addCollider(x, z, hw, hd) {
  colliders.push({ minX: x - hw, maxX: x + hw, minZ: z - hd, maxZ: z + hd });
}

const unitBox = new THREE.BoxGeometry(1, 1, 1);

function createWarmArtPlaceholder(i, w, h) {
  const cw = 512, ch = Math.round(512 * h / w);
  const c = document.createElement('canvas');
  c.width = cw; c.height = ch;
  const g = c.getContext('2d');

  const baseHue = (i * 47) % 360;
  const grad = g.createLinearGradient(0, 0, 0, ch);
  grad.addColorStop(0, `hsl(${baseHue}, 55%, 78%)`);
  grad.addColorStop(0.6, `hsl(${(baseHue + 35) % 360}, 65%, 65%)`);
  grad.addColorStop(1, `hsl(${(baseHue + 75) % 360}, 55%, 45%)`);
  g.fillStyle = grad;
  g.fillRect(0, 0, cw, ch);

  for (let k = 0; k < 30; k++) {
    g.fillStyle = `hsla(${(baseHue + Math.random() * 60) % 360}, 65%, 70%, 0.25)`;
    g.beginPath();
    g.arc(Math.random() * cw, Math.random() * ch, 20 + Math.random() * 80, 0, Math.PI * 2);
    g.fill();
  }

  const fileName = (typeof PHOTO_FILES !== 'undefined' && PHOTO_FILES[i - 1]) ? PHOTO_FILES[i - 1] : null;

  g.fillStyle = 'rgba(255, 255, 255, 0.92)';
  g.roundRect(cw / 2 - 140, ch / 2 - 28, 280, 56, 12);
  g.fill();

  g.fillStyle = '#6b3c1b';
  g.font = 'bold 15px -apple-system, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(fileName ? `Souvenir n°${i}` : `Photo n°${i}`, cw / 2, ch / 2 - 4);
  g.font = '11px sans-serif';
  g.fillStyle = '#9e673f';
  g.fillText(fileName ? fileName : `${PHOTO_FOLDER}${i}.jpg`, cw / 2, ch / 2 + 15);

  const t = new THREE.CanvasTexture(c);
  setSRGB(t);
  return t;
}

const textureLoader = new THREE.TextureLoader();
function tryLoadPhoto(i, onOk) {
  const fileName = (typeof PHOTO_FILES !== 'undefined') ? PHOTO_FILES[i - 1] : null;
  if (!fileName) return;

  // 1. Mode autonome sans serveur (double-clic direct sur index.html)
  if (typeof window !== 'undefined' && window.PHOTOS_DATA && window.PHOTOS_DATA[fileName]) {
    textureLoader.load(window.PHOTOS_DATA[fileName], onOk);
    return;
  }

  // 2. Mode avec serveur HTTP
  const url = `${PHOTO_FOLDER}${encodeURIComponent(fileName)}`;
  textureLoader.load(url, onOk, undefined, (err) => {
    console.warn('Erreur chargement photo:', url, err);
  });
}

const frames = [];

function makeFrame(i, x, y, z, rotY) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.rotation.y = rotY;

  let w = 2.0, h = 1.45;
  if (i > PHOTO_FILES.length) return null;
  const fileName = (typeof PHOTO_FILES !== 'undefined') ? PHOTO_FILES[i - 1] : null;
  if (!fileName) return null;

  if (i % 3 === 0) { w = 1.4; h = 1.9; }

  const border = new THREE.Mesh(unitBox, goldLeafMat);
  border.castShadow = true;

  const matte = new THREE.Mesh(unitPlane, new THREE.MeshStandardMaterial({ color: 0xfffdf7, roughness: 0.95 }));
  const pic = new THREE.Mesh(unitPlane, new THREE.MeshStandardMaterial({
    map: createWarmArtPlaceholder(i, w, h),
    roughness: 0.42,
    metalness: 0.0,
  }));

  // Applique d'éclairage de tableau en laiton discrète et raffinée
  const lampGroup = new THREE.Group();
  const lampBar = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 1, 14), brassMetalMat);
  lampBar.rotation.z = Math.PI / 2;
  lampGroup.add(lampBar);

  const lampStrip = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.035, 0.035), new THREE.MeshStandardMaterial({
    color: 0xffeed0,
    emissive: 0xd4a868,
    emissiveIntensity: 0.45,
    roughness: 0.3,
  }));
  lampGroup.add(lampStrip);

  g.add(border, matte, pic, lampGroup);

  const frameObj = {
    i, group: g, w, h, fileName,
    pos: new THREE.Vector3(x, 0, z),
    normal: new THREE.Vector3(Math.sin(rotY), 0, Math.cos(rotY)),
    title: TITLES[i] || (fileName ? `Souvenir n°${i}` : `Photo n°${i}`),
  };

  frameObj.setSize = (nw, nh) => {
    frameObj.w = nw; frameObj.h = nh;
    border.scale.set(nw + 0.34, nh + 0.34, 0.08);
    border.position.z = 0.04;

    matte.scale.set(nw + 0.12, nh + 0.12, 1);
    matte.position.z = 0.082;

    pic.scale.set(nw, nh, 1);
    pic.position.z = 0.086;

    const ly = nh / 2 + 0.32;
    lampBar.scale.y = Math.min(nw * 0.7, 1.3);
    lampStrip.scale.x = Math.min(nw * 0.65, 1.1);
    lampStrip.position.set(0, -0.04, 0.02);
    lampGroup.position.set(0, ly, 0.24);
  };

  frameObj.setSize(w, h);
  scene.add(g);
  frames.push(frameObj);

  tryLoadPhoto(i, (tex) => {
    setSRGB(tex);
    tex.generateMipmaps = true;
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    const aspect = (tex.image && tex.image.width && tex.image.height) 
      ? tex.image.width / tex.image.height 
      : 1.33;
    let nh = 1.70, nw = nh * aspect;
    if (nw > 3.2) { nw = 3.2; nh = nw / aspect; }
    if (nh > 2.4) { nh = 2.4; nw = nh * aspect; }
    if (pic.material.map && pic.material.map.dispose) pic.material.map.dispose();
    pic.material.map = tex;
    pic.material.roughness = 0.38;
    pic.material.needsUpdate = true;
    frameObj.setSize(nw, nh);
  });

  return frameObj;
}

/* =====================================================================
   PERSONNAGES : BUBU & DUDU HAUTE FIDÉLITÉ (COUSSINETS, VISAGE & SOURIRE)
   ===================================================================== */
function createBear({ isBubu = true } = {}) {
  const root = new THREE.Group();
  const body = new THREE.Group();
  root.add(body);

  // Albédo calibré pour Bubu : peluche douce crème naturelle (ne sature jamais sous la lumière)
  const furColor = isBubu ? 0xebe5db : 0x8a5228;
  const muzzleColor = isBubu ? 0xf5f0e8 : 0xf6ddbf;
  const earColor = isBubu ? 0xf0a8b7 : 0xd89562;
  const blushColor = isBubu ? 0xee8e9f : 0xdf7265;
  const padColor = isBubu ? 0xf2a6b5 : 0xdba174;

  const furMat = new THREE.MeshStandardMaterial({ color: furColor, roughness: 0.94, metalness: 0.0 });
  const muzzleMat = new THREE.MeshStandardMaterial({ color: muzzleColor, roughness: 0.92, metalness: 0.0 });
  const earInnerMat = new THREE.MeshStandardMaterial({ color: earColor, roughness: 0.88, metalness: 0.0 });
  const blushMat = new THREE.MeshStandardMaterial({ color: blushColor, roughness: 0.95, metalness: 0.0 });
  const padMat = new THREE.MeshStandardMaterial({ color: padColor, roughness: 0.85, metalness: 0.0 });
  const blackMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.1 });
  const eyeSparkleMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

  // 1. Corps tout rond et potelé avec silhouette poire kawaii
  const torso = new THREE.Mesh(new THREE.SphereGeometry(0.45, 28, 24), furMat);
  torso.scale.set(1.08, 1.16, 1.0);
  torso.position.set(0, 0.58, 0);
  torso.castShadow = true;
  body.add(torso);

  if (!isBubu) {
    // Ventre crème ovale pour Dudu
    const belly = new THREE.Mesh(new THREE.SphereGeometry(0.35, 22, 18), muzzleMat);
    belly.scale.set(0.96, 1.12, 0.38);
    belly.position.set(0, 0.56, 0.36);
    body.add(belly);
  }

  // Petite queue en pompon rond
  const tail = new THREE.Mesh(new THREE.SphereGeometry(0.12, 14, 12), furMat);
  tail.position.set(0, 0.42, -0.42);
  tail.castShadow = true;
  body.add(tail);

  // 2. Grosse tête ronde aux joues potelées
  const head = new THREE.Group();
  head.position.set(0, 1.16, 0.04);
  body.add(head);

  const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.48, 32, 26), furMat);
  headMesh.scale.set(1.15, 0.98, 1.05); // Joues bien rondes et souples
  headMesh.castShadow = true;
  head.add(headMesh);

  // Oreilles rondes avec intérieur pastel
  const makeEar = (side) => {
    const earG = new THREE.Group();
    earG.position.set(side * 0.38, 0.38, 0.02);
    const outerEar = new THREE.Mesh(new THREE.SphereGeometry(0.16, 18, 16), furMat);
    outerEar.castShadow = true;
    earG.add(outerEar);

    const innerEar = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 14), earInnerMat);
    innerEar.scale.set(1, 1, 0.35);
    innerEar.position.set(0, -0.01, 0.10);
    earG.add(innerEar);
    earG.rotation.z = -side * 0.28;
    return earG;
  };
  const earL = makeEar(-1);
  const earR = makeEar(1);
  head.add(earL, earR);

  // Museau ovale surélevé
  const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.18, 22, 18), muzzleMat);
  muzzle.scale.set(1.18, 0.88, 0.72);
  muzzle.position.set(0, -0.05, 0.44);
  head.add(muzzle);

  // Petit nez noir tout doux
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.045, 14, 12), blackMat);
  nose.scale.set(1.25, 0.85, 0.85);
  nose.position.set(0, 0.02, 0.54);
  head.add(nose);

  // Petite bouche en sourire doux
  const mouthL = new THREE.Mesh(new THREE.TorusGeometry(0.038, 0.008, 8, 16, Math.PI * 0.9), blackMat);
  mouthL.position.set(-0.035, -0.05, 0.53);
  mouthL.rotation.z = Math.PI * 0.05;
  const mouthR = new THREE.Mesh(new THREE.TorusGeometry(0.038, 0.008, 8, 16, Math.PI * 0.9), blackMat);
  mouthR.position.set(0.035, -0.05, 0.53);
  mouthR.rotation.z = Math.PI * 0.05;
  head.add(mouthL, mouthR);

  // Yeux brillants expressifs avec double reflet kawaii
  const makeEye = (side) => {
    const eyeG = new THREE.Group();
    eyeG.position.set(side * 0.19, 0.06, 0.45);
    const eyeBall = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 14), blackMat);
    eyeG.add(eyeBall);

    // Grand reflet pétillant
    const sparkle1 = new THREE.Mesh(new THREE.SphereGeometry(0.018, 8, 8), eyeSparkleMat);
    sparkle1.position.set(0.016, 0.018, 0.04);
    // Petit reflet secondaire
    const sparkle2 = new THREE.Mesh(new THREE.SphereGeometry(0.009, 8, 8), eyeSparkleMat);
    sparkle2.position.set(-0.018, -0.016, 0.04);
    eyeG.add(sparkle1, sparkle2);
    return eyeG;
  };
  head.add(makeEye(-1), makeEye(1));

  // Joues roses toutes douces (blush)
  const makeBlush = (side) => {
    const blush = new THREE.Mesh(new THREE.SphereGeometry(0.09, 14, 12), blushMat);
    blush.scale.set(1.25, 0.72, 0.2);
    blush.position.set(side * 0.34, -0.10, 0.39);
    return blush;
  };
  head.add(makeBlush(-1), makeBlush(1));

  // Jolie fleur rose emblématique de Bubu sur le côté de la tête
  if (isBubu) {
    const flowerG = new THREE.Group();
    flowerG.position.set(0.28, 0.42, 0.26);

    const petalMat = new THREE.MeshStandardMaterial({ color: 0xff8fa8, roughness: 0.6 });
    const centerMat = new THREE.MeshStandardMaterial({ color: 0xffd554, roughness: 0.5 });

    const center = new THREE.Mesh(new THREE.SphereGeometry(0.045, 10, 8), centerMat);
    flowerG.add(center);

    for (let k = 0; k < 5; k++) {
      const ang = (k / 5) * Math.PI * 2;
      const petal = new THREE.Mesh(new THREE.SphereGeometry(0.04, 10, 8), petalMat);
      petal.scale.set(1.1, 0.8, 0.6);
      petal.position.set(Math.cos(ang) * 0.065, Math.sin(ang) * 0.065, 0);
      flowerG.add(petal);
    }
    head.add(flowerG);
  }

  // 3. Petits bras avec coussinets de pattes
  const makeArm = (side) => {
    const shoulder = new THREE.Group();
    shoulder.position.set(side * 0.38, 0.82, 0.04);
    body.add(shoulder);

    const armMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.13, 0.34, 16), furMat);
    armMesh.position.y = -0.15;
    armMesh.castShadow = true;
    shoulder.add(armMesh);

    const paw = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 14), furMat);
    paw.position.y = -0.30;
    paw.castShadow = true;
    shoulder.add(paw);

    // Coussinet sur la paume
    const armPad = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), padMat);
    armPad.scale.set(1.0, 0.8, 0.3);
    armPad.position.set(0, -0.30, 0.11);
    shoulder.add(armPad);

    shoulder.rotation.z = side * 0.14;
    return shoulder;
  };
  const armL = makeArm(-1);
  const armR = makeArm(1);

  // 4. Petites jambes potelées avec coussinets de pattes (3 orteils + coussinet principal)
  const makeLeg = (side) => {
    const hip = new THREE.Group();
    hip.position.set(side * 0.20, 0.30, 0.0);
    body.add(hip);

    const legMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.15, 0.24, 16), furMat);
    legMesh.position.y = -0.11;
    legMesh.castShadow = true;
    hip.add(legMesh);

    const foot = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 14), furMat);
    foot.scale.set(1.0, 0.65, 1.35);
    foot.position.set(0, -0.20, 0.04);
    foot.castShadow = true;
    hip.add(foot);

    // Grand coussinet sous la patte
    const mainPad = new THREE.Mesh(new THREE.SphereGeometry(0.065, 10, 8), padMat);
    mainPad.scale.set(1.0, 0.3, 1.2);
    mainPad.position.set(0, -0.28, 0.04);
    hip.add(mainPad);

    // 3 petits coussinets d'orteils
    for (const tx of [-0.05, 0, 0.05]) {
      const toePad = new THREE.Mesh(new THREE.SphereGeometry(0.024, 8, 6), padMat);
      toePad.scale.set(1.0, 0.3, 1.0);
      toePad.position.set(tx, -0.28, 0.14);
      hip.add(toePad);
    }

    return hip;
  };
  const legL = makeLeg(-1);
  const legR = makeLeg(1);

  return { root, body, head, earL, earR, armL, armR, legL, legR, isBubu };
}

/* =====================================================================
   S'ASSEOIR SUR LES CANAPÉS
   ===================================================================== */
function benchLocalCoords(b, p) {
  const dx = p.x - b.x, dz = p.z - b.z;
  const c = Math.cos(b.r), s = Math.sin(b.r);
  return { lx: dx * c - dz * s, lz: dx * s + dz * c };
}

function getNearestBench() {
  let nearest = null, bestD = Infinity;
  for (const b of benches) {
    const { lx, lz } = benchLocalCoords(b, player.pos);
    const maxHalfW = (b.width || 3.2) / 2 + 0.35;
    // Approche par l'avant ou les côtés du canapé uniquement (pas depuis le mur ou l'arrière du dossier)
    if (Math.abs(lx) < maxHalfW && lz > -0.25 && lz < 2.0) {
      const d = Math.max(0, lz - 0.5) + Math.max(0, Math.abs(lx) - 1.2);
      if (d < bestD) { bestD = d; nearest = b; }
    }
  }
  return nearest;
}

function toggleSit() {
  if (player.sitting) {
    standUp();
    return;
  }
  const b = getNearestBench();
  if (!b) return;

  const { lx } = benchLocalCoords(b, player.pos);
  const maxW = (b.width || 3.0) / 2 - 0.45;
  let targetLx = clamp(lx, -maxW, maxW);
  let targetLz = 0.12;

  if (b.isGrand) {
    targetLz = 0.28;
    if (duduState === 'SITTING_AT_BACK') {
      targetLx = -0.8; // Bubu s'assoit harmonieusement à côté de Dudu (qui est à +0.8)
    }
  }

  const c = Math.cos(b.r), s = Math.sin(b.r);
  const yaw = b.r; // Toujours orienté vers l'avant du canapé

  player.seat = {
    x: b.x + targetLx * c + targetLz * s,
    z: b.z - targetLx * s + targetLz * c,
    yaw,
    bench: b,
  };
  player.sitting = true;

  if (b.isGrand && duduState === 'SITTING_AT_BACK') {
    setDuduBubble("Je t'aime", true);
    playJoyfulChime();
  }
}

function standUp() {
  if (!player.seat) return;
  const st = player.seat;
  player.sitting = false;
  player.pos.x = st.x + Math.sin(st.yaw) * 0.95;
  player.pos.z = st.z + Math.cos(st.yaw) * 0.95;
  player.seat = null;
}

/* =====================================================================
   COLLISIONS & DOUBLE PORTE
   ===================================================================== */
function resolveCollisions(p) {
  for (const b of colliders) {
    const cx = clamp(p.x, b.minX, b.maxX);
    const cz = clamp(p.z, b.minZ, b.maxZ);
    const dx = p.x - cx, dz = p.z - cz;
    const d2 = dx * dx + dz * dz;
    if (d2 < R_CHAR * R_CHAR) {
      if (d2 > 1e-9) {
        const d = Math.sqrt(d2);
        p.x += dx / d * (R_CHAR - d);
        p.z += dz / d * (R_CHAR - d);
      } else {
        const left = p.x - b.minX, right = b.maxX - p.x;
        const top = p.z - b.minZ, bottom = b.maxZ - p.z;
        const minE = Math.min(left, right, top, bottom);
        if (minE === left) p.x = b.minX - R_CHAR;
        else if (minE === right) p.x = b.maxX + R_CHAR;
        else if (minE === top) p.z = b.minZ - R_CHAR;
        else p.z = b.maxZ + R_CHAR;
      }
    }
  }
}

let touchingDoorOutside = false;

function resolveDoorInteraction(p, isPushingForward, dt) {
  touchingDoorOutside = false;
  if (p.z > -0.5 && p.z < 2.8 && Math.abs(p.x) < DOOR_W / 2 + 0.35) {
    if (p.z > 0) {
      touchingDoorOutside = true;
      if (isPushingForward) {
        doorAngle = Math.min(DOOR_MAX, doorAngle + dt * 2.6);
        playDoorCreak();
      }
    }
    if (doorAngle < 0.55 && p.z > 0.05) {
      p.z = Math.max(p.z, 0.22);
    }
  }
}

/* =====================================================================
   CAMÉRA
   ===================================================================== */
const cameraRaycaster = new THREE.Raycaster();
let smoothedCamYaw = player.yaw;
const targetHead = new THREE.Vector3();
const camLookDir = new THREE.Vector3();

function updateCamera(dt) {
  smoothedCamYaw += wrapAngle(player.yaw - smoothedCamYaw) * (1 - Math.exp(-dt * 6.5));
  const currentYaw = (isFirstPerson ? player.yaw : smoothedCamYaw) + orbitYaw;
  const currentPitch = (isFirstPerson ? 0.0 : 0.25) + orbitPitch;

  if (isFirstPerson) {
    const eyeY = player.sitting ? 1.50 : 1.35;
    camera.position.set(player.pos.x, eyeY, player.pos.z);
    camLookDir.set(
      Math.sin(currentYaw) * Math.cos(currentPitch),
      Math.sin(currentPitch),
      Math.cos(currentYaw) * Math.cos(currentPitch)
    );
    camera.lookAt(camera.position.clone().add(camLookDir));
  } else {
    const headY = player.sitting ? 1.45 : 1.15;
    targetHead.set(bubu.root.position.x, headY, bubu.root.position.z);

    camLookDir.set(
      -Math.sin(currentYaw) * Math.cos(currentPitch),
      Math.sin(currentPitch),
      -Math.cos(currentYaw) * Math.cos(currentPitch)
    ).normalize();

    let dist = camDist;
    cameraRaycaster.set(targetHead, camLookDir);
    cameraRaycaster.far = camDist;
    const hits = cameraRaycaster.intersectObjects(camBlockers, false);
    if (hits.length) {
      dist = Math.max(0.6, hits[0].distance - 0.25);
    }

    camera.position.copy(targetHead).addScaledVector(camLookDir, dist);
    camera.lookAt(targetHead.x, targetHead.y + 0.1, targetHead.z);
  }
}

/* =====================================================================
   HUD & CARTELS
   ===================================================================== */
const hintElement = document.getElementById('hint');
let currentHintText = '';

function setHint(text) {
  if (text === currentHintText) return;
  currentHintText = text;
  hintElement.style.display = text ? 'block' : 'none';
  hintElement.textContent = text;
}

/* =====================================================================
   BOUCLE PRINCIPALE D'ANIMATION & LOGIQUE
   ===================================================================== */
const clock = new THREE.Clock();
let stepAccumulator = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const p = player.pos;

  let moveZ = 0;
  if (started && !player.sitting) {
    const turn = (keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0);
    moveZ = (keys.ArrowUp ? 1 : 0) - (keys.ArrowDown ? 1 : 0);

    player.yaw += turn * 2.5 * dt;

    const isRunning = keys.ShiftLeft || keys.ShiftRight;
    const currentSpeed = moveZ > 0 ? (isRunning ? 5.8 : 3.2) : 2.0;

    p.x += Math.sin(player.yaw) * moveZ * currentSpeed * dt;
    p.z += Math.cos(player.yaw) * moveZ * currentSpeed * dt;

    resolveCollisions(p);
    resolveDoorInteraction(p, moveZ > 0, dt);
    resolveCollisions(p);

    p.x = clamp(p.x, -85, 85);
    p.z = clamp(p.z, -110, 65);

    if (moveZ || turn) {
      orbitYaw *= Math.exp(-dt * 3.5);
      orbitPitch *= Math.exp(-dt * 3.5);
    }

    const animSpeed = (isRunning && moveZ > 0 ? 11 : 7.5);
    walkPhase += dt * animSpeed * (moveZ === 0 ? 0 : 1);

    if (moveZ !== 0) {
      stepAccumulator += dt * animSpeed;
      if (stepAccumulator > Math.PI) {
        stepAccumulator -= Math.PI;
        const onCarpet = (p.z < 0 && Math.abs(p.x) < 2.0);
        playFootstep(p.z < 0, isRunning, onCarpet);
      }
    }
  } else if (player.sitting && (keys.ArrowUp || keys.ArrowDown)) {
    standUp();
  }

  // Ouverture des portes
  const distToDoor = Math.hypot(p.x, p.z);
  if (p.z < -0.3 && distToDoor < 3.5 && Math.abs(p.x) < 3.2) {
    doorAngle = Math.min(DOOR_MAX, doorAngle + dt * 1.5);
  } else if (distToDoor > 5.2) {
    doorAngle = Math.max(0, doorAngle - dt * 0.7);
  }
  doorPivotL.rotation.y = doorAngle;
  doorPivotR.rotation.y = -doorAngle;

  // Animation de Bubu
  const targetSit = player.sitting ? 1 : 0;
  sitAmt = lerp(sitAmt, targetSit, 1 - Math.exp(-dt * 9));

  if (player.sitting && player.seat) {
    const st = player.seat;
    p.x = lerp(p.x, st.x, 1 - Math.exp(-dt * 10));
    p.z = lerp(p.z, st.z, 1 - Math.exp(-dt * 10));
    player.yaw += wrapAngle(st.yaw - player.yaw) * (1 - Math.exp(-dt * 10));
  }

  bubu.root.position.set(p.x, 0, p.z);
  bubu.root.rotation.y = player.yaw;

  walkAmt = lerp(walkAmt, moveZ !== 0 ? 1 : 0, 1 - Math.exp(-dt * 10));
  const sinWalk = Math.sin(walkPhase) * walkAmt * (moveZ < 0 ? -1 : 1);
  const waddleRoll = Math.sin(walkPhase) * 0.14 * walkAmt;
  const verticalBounce = Math.abs(Math.sin(walkPhase * 2)) * 0.05 * walkAmt;

  const blendSit = (a, b) => lerp(a, b, sitAmt);

  // Respiration douce assise et positionnement stable sur le coussin du fauteuil
  const sitBreath = player.sitting ? Math.sin(clock.elapsedTime * 2.2) * 0.012 : 0;

  bubu.body.position.y = blendSit(verticalBounce, 0.40 + sitBreath);
  bubu.body.rotation.x = blendSit(0, -0.08);
  bubu.body.rotation.z = blendSit(waddleRoll, 0);

  // Jambes tendues vers l'avant reposant sur l'assise du canapé avec coussinets visibles
  bubu.legL.rotation.x = blendSit(sinWalk * 0.65, -Math.PI / 2);
  bubu.legR.rotation.x = blendSit(-sinWalk * 0.65, -Math.PI / 2);
  bubu.legL.rotation.y = blendSit(0, -0.12);
  bubu.legR.rotation.y = blendSit(0, 0.12);
  bubu.legL.rotation.z = blendSit(0, -0.08);
  bubu.legR.rotation.z = blendSit(0, 0.08);

  // Bras mignons reposant délicatement sur le canapé / les côtés
  bubu.armL.rotation.x = blendSit(-sinWalk * 0.55, -0.42);
  bubu.armR.rotation.x = blendSit(sinWalk * 0.55, -0.42);
  bubu.armL.rotation.z = blendSit(-0.14 - Math.abs(sinWalk) * 0.15, -0.28);
  bubu.armR.rotation.z = blendSit(0.14 + Math.abs(sinWalk) * 0.15, 0.28);

  // Légère inclinaison de la tête pour un rendu expressif
  bubu.head.rotation.x = blendSit(0, -0.04);
  bubu.head.rotation.z = blendSit(0, 0.05);

  bubu.earL.rotation.x = Math.sin(walkPhase * 2) * 0.1 * walkAmt;
  bubu.earR.rotation.x = -Math.sin(walkPhase * 2) * 0.1 * walkAmt;

  // ---------------- SCÉNARIO DE DUDU ----------------
  duduTimer += dt;

  if (duduState === 'WAITING') {
    dudu.root.rotation.y = Math.PI;
    dudu.body.position.y = Math.sin(clock.elapsedTime * 2.5) * 0.02;

    if (p.z < -1.0) {
      duduState = 'GREETING';
      duduTimer = 0;
      playJoyfulChime();
      setDuduBubble("Coucou Bubu ! Bienvenue dans notre galerie d'art ! Viens voir nos photos !", true);
    }
  } else if (duduState === 'GREETING') {
    const dx = p.x - dudu.root.position.x;
    const dz = p.z - dudu.root.position.z;
    dudu.root.rotation.y = Math.atan2(dx, dz);

    const happyHop = Math.abs(Math.sin(duduTimer * 8)) * 0.14;
    dudu.body.position.y = happyHop;
    dudu.armL.rotation.x = -1.8 + Math.sin(duduTimer * 10) * 0.4;
    dudu.armR.rotation.x = -1.8 - Math.sin(duduTimer * 10) * 0.4;
    dudu.armL.rotation.z = -0.5;
    dudu.armR.rotation.z = 0.5;

    if (duduTimer > 3.8) {
      duduState = 'WALKING_TO_BACK';
      duduTimer = 0;
      setDuduBubble("Je t'attends sur le grand canapé au fond, viens me rejoindre !", true);
    }
  } else if (duduState === 'WALKING_TO_BACK') {
    const targetZ = -57.0;
    const targetX = 0.8;

    const diffX = targetX - dudu.root.position.x;
    const diffZ = targetZ - dudu.root.position.z;
    const distToSofa = Math.hypot(diffX, diffZ);

    const moveAngle = Math.atan2(diffX, diffZ);
    dudu.root.rotation.y = lerp(dudu.root.rotation.y, moveAngle, 0.1);

    const duduSpeed = 2.8;
    dudu.root.position.x += Math.sin(moveAngle) * duduSpeed * dt;
    dudu.root.position.z += Math.cos(moveAngle) * duduSpeed * dt;

    const dPhase = duduTimer * 7.5;
    const dSin = Math.sin(dPhase);
    dudu.body.rotation.z = Math.sin(dPhase) * 0.12;
    dudu.body.position.y = Math.abs(Math.sin(dPhase * 2)) * 0.05;
    dudu.legL.rotation.x = dSin * 0.6;
    dudu.legR.rotation.x = -dSin * 0.6;
    dudu.armL.rotation.x = -dSin * 0.5;
    dudu.armR.rotation.x = dSin * 0.5;

    if (distToSofa < 0.6) {
      duduState = 'SITTING_AT_BACK';
      duduTimer = 0;
      dudu.root.position.set(targetX, 0, targetZ);
      dudu.root.rotation.y = 0;
      setDuduBubble("Je suis au fond, viens t'asseoir à côté de moi !", true);
      setTimeout(() => {
        if (duduState === 'SITTING_AT_BACK' && !player.sitting) {
          setDuduBubble('', false);
        }
      }, 5000);
    }
  } else if (duduState === 'SITTING_AT_BACK') {
    dudu.root.position.set(0.8, 0, -57.2);
    dudu.root.rotation.y = 0;
    dudu.body.position.y = 0.40 + Math.sin(clock.elapsedTime * 2.0) * 0.012;
    dudu.body.rotation.x = -0.08;
    dudu.body.rotation.z = 0;
    dudu.legL.rotation.x = -Math.PI / 2;
    dudu.legR.rotation.x = -Math.PI / 2;
    dudu.legL.rotation.y = -0.12;
    dudu.legR.rotation.y = 0.12;
    dudu.legL.rotation.z = -0.08;
    dudu.legR.rotation.z = 0.08;
    dudu.armL.rotation.x = -0.42;
    dudu.armR.rotation.x = -0.42;
    dudu.armL.rotation.z = -0.28;
    dudu.armR.rotation.z = 0.28;

    const distToBubu = Math.hypot(p.x - dudu.root.position.x, p.z - dudu.root.position.z);
    if (distToBubu < 4.0) {
      const angle = Math.atan2(p.x - dudu.root.position.x, p.z - dudu.root.position.z);
      dudu.head.rotation.y = lerp(dudu.head.rotation.y, clamp(angle, -0.8, 0.8), 0.1);
    } else {
      dudu.head.rotation.y = lerp(dudu.head.rotation.y, 0, 0.1);
    }
  }

  // Positionnement de la bulle de dialogue
  if (duduBubbleVisible) {
    const duduHeadPos = new THREE.Vector3();
    dudu.head.getWorldPosition(duduHeadPos);
    duduHeadPos.y += 0.55;
    duduHeadPos.project(camera);
    if (duduHeadPos.z < 1.0) {
      const sx = (duduHeadPos.x * 0.5 + 0.5) * innerWidth;
      const sy = (-duduHeadPos.y * 0.5 + 0.5) * innerHeight;
      duduBubbleEl.style.left = `${sx}px`;
      duduBubbleEl.style.top = `${sy}px`;
      duduBubbleEl.style.display = 'block';
    } else {
      duduBubbleEl.style.display = 'none';
    }
  } else {
    duduBubbleEl.style.display = 'none';
  }

  updateCamera(dt);

  let hintMessage = '';
  if (player.sitting) {
    hintMessage = 'E ou Espace : Se relever du canapé';
  } else if (touchingDoorOutside || (p.z > 0 && p.z < 3.2 && Math.abs(p.x) < 1.8 && doorAngle < 1.2)) {
    hintMessage = 'Pousse la porte : Dudu t\'attend à l\'intérieur';
  } else if (getNearestBench()) {
    hintMessage = 'E ou Espace : S\'asseoir sur le canapé';
  }
  setHint(started ? hintMessage : '');

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
